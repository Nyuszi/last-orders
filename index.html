<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <div>
      <h1 class="brand">LAST ORDERS</h1>
      <p class="sub" id="sub">NIGHT 1 · THE COPPER SPUR</p>
    </div>
    <div class="top-right">
      <nav class="nights" aria-label="Nights" id="nights"></nav>
      <button type="button" class="help-btn" id="retry-btn" aria-label="Start the night again" title="Start the night again">
        <svg class="snd-icon" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="4" y="1" width="6" height="2"/><rect x="2" y="3" width="2" height="2"/><rect x="1" y="5" width="2" height="6"/><rect x="2" y="11" width="2" height="2"/>
          <rect x="4" y="13" width="7" height="2"/><rect x="11" y="11" width="2" height="2"/><rect x="13" y="8" width="2" height="3"/>
          <rect x="9" y="3" width="7" height="1"/><rect x="10" y="4" width="5" height="1"/><rect x="11" y="5" width="3" height="1"/><rect x="12" y="6" width="1" height="1"/>
        </svg>
      </button>
      <button type="button" class="help-btn" id="sound-btn" aria-label="Sound and music" title="Sound and music" aria-controls="sound" aria-expanded="false">
        <svg class="snd-icon" viewBox="0 0 17 16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1" y="5" width="4" height="6"/><rect x="5" y="3" width="2" height="10"/><rect x="7" y="1" width="2" height="14"/>
          <g class="snd-waves"><rect x="11" y="5" width="2" height="6"/><rect x="14" y="2" width="2" height="12"/></g>
          <g class="snd-x"><rect x="11" y="4" width="2" height="2"/><rect x="15" y="4" width="2" height="2"/><rect x="13" y="6" width="2" height="4"/><rect x="11" y="10" width="2" height="2"/><rect x="15" y="10" width="2" height="2"/></g>
        </svg>
      </button>
      <button type="button" class="help-btn" id="help-btn" aria-label="How to play" title="How to play">?</button>
    </div>
  </header>

  <section class="brief" aria-live="polite">
    <p class="label"><span class="label-main">TONIGHT'S ORDERS <span class="try-tag" id="try-tag">TRY 1</span> <span class="help-tag" id="help-tag" hidden>USED HELP</span></span> <span id="par"></span></p>
    <p class="blurb" id="blurb"></p>
    <ul class="chips" id="chips"></ul>
  </section>

  <div class="stage" id="stage">
    <!-- The beer tap: pull the knob down for strength, let go to pour. Sprites are set in main.ts. -->
    <div class="tap" id="power" role="slider" aria-label="Beer tap: drag down to set the strength, let go to pour" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <img class="t-top" id="tap-top" alt="">
      <div class="t-column" id="tap-column"></div>
      <img class="t-tray" id="tap-tray" alt="">
      <div class="t-slot"></div>
      <div class="t-beer" id="tap-beer"></div>
      <div class="t-last" id="tap-last" hidden></div>
      <div class="t-ticks" aria-hidden="true"><span>0</span><span>¼</span><span>½</span><span>¾</span><span>1</span></div>
      <img class="t-knob" id="tap-knob" alt="">
    </div>
    <div class="board" id="board">
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="coach" id="coach" aria-live="polite" hidden></div>
      <div class="tip" id="tip" role="tooltip" hidden></div>
      <!-- A served customer's happy face, popping up on their side of the bar (no text). -->
      <img class="joy" id="joy" alt="" hidden>
      <div class="cutin" id="cutin" hidden>
        <div class="cutin-band">
          <img id="cutin-img" alt="">
          <p class="cutin-bubble"><span id="cutin-name"></span><strong id="cutin-line"></strong></p>
        </div>
      </div>
      <!-- How to play: shown when a night loads. Blocks the bar until tapped, so nothing fires by accident. -->
      <div class="howto" id="howto" hidden role="dialog" aria-label="How to play">
        <p class="howto-text" id="howto-text"></p>
        <div class="howto-tags" id="howto-tags" aria-hidden="true"></div>
        <div class="ghost" id="ghost" aria-hidden="true" hidden>
          <span class="ghost-hand">
            <svg viewBox="0 0 12 16" width="30" height="40" shape-rendering="crispEdges">
              <rect x="3" y="0" width="4" height="9" fill="#1a0f0a"/><rect x="0" y="6" width="12" height="10" fill="#1a0f0a"/>
              <rect x="1" y="7" width="10" height="8" fill="#f3d2b0"/><rect x="4" y="1" width="2" height="7" fill="#f3d2b0"/>
              <rect x="4" y="1" width="1" height="6" fill="#fff4e4"/><rect x="7" y="9" width="1" height="2" fill="#c99a78"/><rect x="9" y="9" width="1" height="2" fill="#c99a78"/>
            </svg>          </span>
        </div>
        <p class="howto-tap">Tap anywhere to start</p>
      </div>
      <canvas id="game" aria-label="The bar, seen from above. Drag sideways to turn the aim; the line shows where the drink will go."></canvas>
    </div>
  </div>

  <section class="controls">
    <div class="pours">
      <span class="small-label">POURS LEFT</span>
      <div class="pours-row"><div class="bottles" aria-label="Pours left" id="bottles"></div><span class="pours-left" id="pours-left" aria-hidden="true"></span></div>
      <p class="tips"><span class="small-label">TIPS</span> <span id="tips">0c</span></p>
    </div>
    <p class="keys" aria-label="Keyboard controls"><kbd>Q</kbd><kbd>E</kbd> aim · hold <kbd>Space</kbd> to pull the tap, let go to pour · <kbd>Shift</kbd> fine aim</p>
    <button type="button" class="spin-toggle" id="spin-toggle" aria-expanded="false" aria-controls="spin-box">Spin <span id="spin-short">off</span></button>
    <div class="spin" id="spin-box">
      <canvas id="spinpad" width="28" height="28" aria-label="Spin: tap the glass where you want to hit it. Left of centre curves left, right of centre curves right."></canvas>
      <div class="spin-text">
        <span class="small-label">SPIN</span>
        <span class="spin-val" id="spin-val">NONE</span>
        <button type="button" class="spin-reset" id="spin-reset">Centre</button>
      </div>
    </div>
  </section>

  <div class="result" id="result" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="r-title">
      <p class="label" id="r-night"></p>
      <h2 id="r-title"></h2>
      <p class="r-sub" id="r-sub"></p>
      <ul class="badges" id="r-badges"></ul>
      <pre class="share" id="r-share"></pre>
      <p class="r-stats" id="r-stats" hidden></p>
      <div class="r-actions">
        <button type="button" class="primary" id="r-post" hidden>Share in comments</button>
        <button type="button" class="primary" id="r-copy">Copy result</button>
        <button type="button" id="r-replay">Watch replay</button>
        <button type="button" id="r-retry">Play again <kbd class="key-hint">Space</kbd></button>
        <button type="button" id="r-next">Next night</button>
        <button type="button" class="help" id="r-help">Show me how</button>
      </div>
    </div>
  </div>
</main>
<!-- Sound panel: music choice, volumes, and four versions of every sound effect (built in audio.ts). -->
<div class="sound px-box" id="sound" role="dialog" aria-label="Sound and music" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
